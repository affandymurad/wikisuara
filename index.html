<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wikisuara — Perekam Suara Terbuka</title>
    <meta name="description" content="Perekam suara kata dan frasa berformat WAV (PCM 16-bit) langsung di browser tanpa login dan tanpa upload." />
    <meta property="og:title" content="Wikisuara — Perekam Suara Terbuka" />
    <meta property="og:description" content="Perekam suara kata dan frasa berformat WAV (PCM 16-bit) langsung di browser tanpa login dan tanpa upload." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
      try {
        var saved = localStorage.getItem('theme') || 'system';
        var dark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
